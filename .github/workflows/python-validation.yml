name: Python validation

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile bot
        run: python -m compileall -q bot.py
      - name: Validate dependencies file
        run: python -c "from pathlib import Path; p=Path('requirements.txt'); assert p.is_file() and p.stat().st_size > 0"
